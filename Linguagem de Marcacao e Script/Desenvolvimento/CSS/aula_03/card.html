<!doctype html>
<html>
  <head>
    <style>

        .div-parent {
            width: 250px;
            border: 1px solid lightgrey;
            border-radius: 5px;
            font-family: Arial, Helvetica, sans-serif;
        }
        .div-image {
            height: 150px;
            background-color: lightgrey;
            color: white;
            
            
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .div-item {
            border-top: solid 1px lightgrey;
            padding: 10px;
        }
        a {
            margin-right: 10px;
        }

    </style>
  </head>
  <body>
    <div class="div-parent">
      <div class="div-image">Image cap</div>
      <div class="div-item">
        <h3>Card Title</h3>
        <p>
          Some quick example text to build on the card title and make up the
          bulk of the card’s content.
        </p>
      </div>
      <div class="div-item">
        An item
      </div>
      <div class="div-item">
        An second item
      </div class="div-item">
      <div class="div-item">
        An third item
      </div>
      <div class="div-item">
        <a href="#">Card Link</a>
        <a href="#">Another Link</a>
      </div>
    </div>
  </body>
</html>
