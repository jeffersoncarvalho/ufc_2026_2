<!DOCTYPE html>
<html lang="pt-br">
<head>
<style>
    /*div {
        background-color: red;
        width: 200px;
        height: 200px;
        margin: 20px;
    }*/
    /*KEBAB CASE*/
    .div-laranja {
        background-color: orange;
        border: 2px solid red;
        width: 100px;
        height: 100px;
        font-family: Arial, Helvetica, sans-serif;
        margin: 10px;
    }
    .div-roxa {
        background-color: purple;
        border: 2px solid yellow;
        width: 100px;
        height: 100px;
        font-family: 'Courier New', Courier, monospace;
        margin: 10px;
        color: white;
    }
    .div-parent {

        display: flex;
        flex-direction: row;
        justify-content: center;
        align-items: center;

        width: 300px;
        height: 300px;
        background-color: yellow;
        margin: 10px;
    }
    .div-child {
        width: 50px;
        height: 50px;
        background-color: red;
        margin: 5px;
    }
    .div-child-diferente {
        width: 50px;
        height: 50px;
        background-color: gray;
        margin: 5px;
    }
</style>
</head>
<body>

    <div class="div-laranja">
        DIV 1
    </div>
    <div class="div-roxa">
        DIV 2
    </div>

    <div class="div-parent">
        <div class="div-child">
            
        </div> 
        
    </div>

</body>
</html>
