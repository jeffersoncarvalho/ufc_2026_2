<!DOCTYPE html>
<html lang="pt-br">
<head>
<style>
    .card {
        border: 1px solid gray;
        border-radius: 5px;
        width: 300px;
        font-family: Arial, Helvetica, sans-serif;
    }
    .card-image {
        background-color: gray;
        color: white;

        height: 180px;

        display: flex;
        /*flex-direction: row;*/
        justify-content: center;
        align-items: center;
    }
    .card-description {
        /*padding-left: 15px;
        padding-right: 20px;*/
        /*padding: 0px 15px;*/
        padding: 0px 20px 0px 15px;

        text-align: justify;
    }
    .card-item, .card-links {
        /*padding-top: 10px;
        padding-right: 20px;
        padding-bottom: 10px;
        padding-left: 15px;*/
        padding: 10px 20px 10px 15px;

        border-top: solid 1px gray;
    }
    .card-links {
        display: flex;
        gap: 20px;
    }
</style>
</head>
<body>
    <h1>Criando um Card</h1>
    <div class="card">
        <div class="card-image">
            Image cap
        </div>
        <div class="card-description">
            <h3>Card Title</h3>
            <p>
                Some quick example text to build on the card title and make up the bulk of the card’s content.
            </p>
        </div>
        <div class="card-item">
            An item
        </div>
        <div class="card-item">
            A second item
        </div>
        <div class="card-item">
            A third item
        </div>
        <div class="card-links">
            <a href="#">Card link</a>
            <a href="#">Another link</a>
        </div>
    </div>
</body>
</html>
