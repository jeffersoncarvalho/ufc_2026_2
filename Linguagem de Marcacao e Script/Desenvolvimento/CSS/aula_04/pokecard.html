<!DOCTYPE html>
<html lang="pt-br">
<head>
<style>
    .card {
        border: 3px solid black;
        border-radius: 5px;
        width: 300px;

        font-family: Arial, Helvetica, sans-serif;
    }
    .card-image {
        background-color: #c0c0c0;
        text-align: center;
        margin: 5px;
    }
    .card-info, .card-skills {
        padding-left: 30px;
    }
</style>
</head>
<body>
    <div class="card">
        <div class="card-image">
            <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/25.png"
                alt="Pikachu"
                width="250px"
            />
        </div>
        <div class="card-info">
            N<sup>o</sup> 00001
            <h2>Pikachu</h2>
        </div>
        <div class="card-skills">
            <span>Planta</span>
            <span>Electric</span>
        </div>
    </div>
</body>
</html>
