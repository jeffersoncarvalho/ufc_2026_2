<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <style>
            .container {
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;

                margin-top: 50px;
            }
            #professor-img {
                height: 300px;
                border: 3px solid black;
                border-radius: 5px;

                padding: 5px;
            }

            .container > header {
                font-size: larger;
                font-weight: bold;
                font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
                padding: 20px;
            }

            .grupo-botoes {
                display: flex;
                flex-direction: row;
                justify-content: space-between;
                gap: 10px;

                margin-top: 10px;
            }

            .grupo-botoes > button {
                font-size: smaller;
                flex: 1;
            }
        </style>
    </head>
    <body>
        <main class="container">
            <header>Passa Professor!</header>
            <div>
                <img id="professor-img" src="https://www.quixada.ufc.br/wp-content/uploads/2015/11/Diana-Braga-226x300.png" />
                <div class="grupo-botoes">
                    <button id="botao-voltar" onclick="voltar()">VOLTAR - 1</button>
                    <button id="botao-adiantar" onclick="adiantar()">ADIANTAR + 1</button>
                </div>
            </div>
        </main>
        
        <script src="./passa_professor.js">
    </script>
    </body>
</html>
