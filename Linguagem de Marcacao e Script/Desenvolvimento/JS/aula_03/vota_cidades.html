<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <style>
      header > h1 {
        background-color: bisque;
        padding: 40px;

        font-size: 80px;
        font-family: Arial, Helvetica, sans-serif;

        text-align: center;
      }

      .cidades {
        display: flex;
        flex-direction: column;
        gap: 10px;

        font-family:
          "Trebuchet MS", "Lucida Sans Unicode", "Lucida Grande", "Lucida Sans",
          Arial, sans-serif;
        font-size: 30px;

        padding: 20px;
        padding-bottom: 60px;
      }
      .botoes {
        display: flex;
        justify-content: space-evenly;

        background-color: antiquewhite;
        padding: 20px;
        
      }

      .botoes > button {
        background-color: blue;
        color: white;

        font-size: larger;
        font-weight: bold;

        padding: 10px;
        border-radius: 5px;

        width: 150px;
      }
      .resultado {
        font-family:
          "Lucida Sans", "Lucida Sans Regular", "Lucida Grande",
          "Lucida Sans Unicode", Geneva, Verdana, sans-serif;
        background-color: azure;

        padding: 20px;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>VOTA CIDADES</h1>
    </header>
    <main>
      <div class="cidades">
        <span>FORTALEZA: <span id="votos-fortaleza">0</span> </span>
        <span>QUIXADÁ: <span id="votos-quixada">0</span> </span>
        <span>SOBRAL: <span id="votos-sobral">0</span> </span>
        <span>CRATEÚS: <span id="votos-crateus">0</span> </span>
      </div>
      <div class="botoes">
        <button onclick="inserirVoto('fortaleza')">FORTALEZA</button>
        <button onclick="inserirVoto('quixada')">QUIXADÁ</button>
        <button onclick="inserirVoto('sobral')">SOBRAL</button>
        <button onclick="inserirVoto('crateus')">CRATEÚS</button>
      </div>
      <div class="resultado">
        <h2>CIDADE MAIS VOTADA: FORTALEZA</h2>
        <h2>CIDADE MENOS VOTADA: FORTALEZA</h2>
      </div>
    </main>
    <script src="./vota_cidades.js">

    </script>
  </body>
</html>
